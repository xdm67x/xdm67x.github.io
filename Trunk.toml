# Trunk builds and serves the whole site — no other toolchain is involved.
#
#   trunk serve            dev server, live reload on http://127.0.0.1:8080
#   trunk build --release  production build into dist/
#
# Trunk compiles renderer/ to WebAssembly, resolves the wasm-bindgen CLI
# version that matches Cargo.lock, and emits the module's TypeScript
# declarations. The front end (web/) is plain ES modules and needs no build
# step, so this file plus index.html describe the entire pipeline.
#
# One known wart: Trunk's JavaScript minifier cannot read the wasm-bindgen glue
# (it emits `export default`), so every release build logs a single "Failed to
# minify JS" warning and ships the scripts unminified. CSS is still minified.

[build]
target = "index.html"
dist = "dist"
filehash = false
minify = "on_release"
# No sub-resource integrity: the document and the assets it names can be cached
# independently by the CDN, and a stale hash would block the stylesheet.
# Trunk hashes file names instead when `filehash` is on.
no_sri = true

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[watch]
# The crate lives outside the target's directory, so watch it explicitly:
# editing Rust rebuilds the module and reloads the page.
watch = ["web", "index.html", "renderer/src", "renderer/Cargo.toml"]
